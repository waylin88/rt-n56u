name: CI

# Controls when the action will run.
on:
  # push:
  # pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: '选择要编译的机型（仅编译一个）'
        required: true
        default: 'PSG1218'
        type: choice
        options:
          - PSG1208
          - PSG1218
          - PSG1218_nano
          - NEWIFI-MINI
          - NEWIFI3
          - MI-MINI
          - MI-NANO
          - MI-3
          - MI-3C
          - MI-R3P
          - MI-R3P-breed
          - MI-R3G
          - MI-R4A
          - MI-4
          - OYE-001
          - 5K-W20
          - HC5861B
          - HC5761A
          - HC5661A
          - MZ-R13
          - MZ-R13P
          - 360P2
          - K2P
          - K2P_nano
          - K2P-USB
          - DIR-878
          - DIR-882
          - RM2100
          - CR660x
          - R2100
          - XY-C1
          - JCG-836PRO
          - JCG-AC860M
          - JCG-Y2
          - JCG-Q20
          - A3004NS
          - MSG1500
          - WR1200JS
          - B70
          - WDR7300
          - MR2600
          - E8820V2
          - ZTE_E8820S
          - NETGEAR-BZV
          - NETGEAR-CHJ
          - RT-AC1200GU
          - R6220
  release:
    types: [published]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    name: build ${{ inputs.target || 'PSG1218' }}
    runs-on: ubuntu-22.04
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    env:
      target: ${{ inputs.target || 'PSG1218' }}
      images_dir: /opt/images
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          sudo apt update
          sudo apt install libtool-bin gperf python3-docutils autopoint gettext p7zip-full fakeroot
      - name: Run shellcheck
        run: sh ./trunk/tools/shellcheck.sh
      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
      - name: Start build
        run: |
          cd trunk
          mkdir -p ${images_dir}
          echo "Building target: ${target}"
          fakeroot ./build_firmware_ci ${target}
          if [ $? -ne 0 ]; then
            echo "Build failed for ${target}"
            exit 1
          fi
          cp -f images/*.trx ${images_dir}/
          ./clear_tree_simple >/dev/null 2>&1
      - name: Create archive
        if: ${{ github.event_name != 'release' && success() }}
        run: |
          ls -lh ${images_dir}
          GIT_VERSION=`git rev-parse --short=7 HEAD 2>/dev/null` && [ -n "$GIT_VERSION" ] && \
          image_name=images_${target}_${GIT_VERSION} || image_name=images_${target}
          cd ${images_dir}; md5sum *.trx |tee md5sum.txt; 7z a -mx=9 ${image_name}.7z ./*
          echo "image_name=${image_name}" >> $GITHUB_ENV
      - name: Upload images to Artifact
        if: ${{ github.event_name != 'release' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.image_name }}
          path: ${{ env.images_dir }}/*.7z
      - name: Upload images to Releases
        if: ${{ github.event_name == 'release' && success() }}
        uses: svenstaro/upload-release-action@2.2.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.images_dir }}/*.trx
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
